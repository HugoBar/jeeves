# Connects to an existing Postgres instance; set DATABASE_URL in .env (see .env.example).
services:
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}

  app:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
