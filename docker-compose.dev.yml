# Development-only Postgres, matching DATABASE_URL in .env.example.
# Start: pnpm db:up   Stop: pnpm db:down   (data is kept in the jeeves-dev-db volume)
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: jeeves
      POSTGRES_PASSWORD: jeeves
      POSTGRES_DB: jeeves
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jeeves-dev-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeeves -d jeeves"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  jeeves-dev-db:
